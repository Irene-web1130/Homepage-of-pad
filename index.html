        /* ===== 自訂標題 ===== */
        .my-title {
            max-width: 100%;
            margin-bottom: 20px;

            font-size: 38px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            color: #ffffff;

            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        }

        /* ===== 捷徑區 ===== */
        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;

            margin-bottom: 35px;
            max-width: 100%;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            min-width: 55px;

            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            text-align: center;

            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);

            transition: transform 0.2s;
        }

        .shortcut-item:active {
            transform: scale(0.92);
        }

        .shortcut-icon {
            width: 55px;
            height: 55px;
            flex-shrink: 0;

            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);

            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 26px;
            margin-bottom: 8px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* ===== 新分頁捷徑 ===== */
        .new-tab-icon {
            background: rgba(255, 255, 255, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.45);
            font-size: 30px;
        }

        /* ===== 搜尋欄 ===== */
        .search-container {
            width: 90%;
            max-width: 600px;
            flex-shrink: 0;
        }

        .search-box {
            width: 100%;

            padding: 8px 8px 8px 20px;

            background: rgba(255, 255, 255, 0.2);

            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .search-box form {
            width: 100%;
            margin: 0;
            padding: 0;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 42px;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 0;
            outline: none;

            background: transparent;
            box-shadow: none;

            font-family: inherit;
            font-size: 16px;
            line-height: normal;

            color: #ffffff;

            -webkit-appearance: none;
            appearance: none;
        }

        .search-box input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.75);
        }

        .search-box input[type="submit"] {
            flex-shrink: 0;

            min-height: 42px;
            margin: 0;
            padding: 10px 24px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50px;

            background: rgba(255, 255, 255, 0.95);
            color: #333333;

            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            line-height: 1;

            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;
        }

        .search-box input[type="submit"]:active {
            transform: scale(0.96);
        }

        /* ===== 小螢幕適配 ===== */
        @media (max-width: 480px) {
            body {
                padding-right: 12px;
                padding-left: 12px;
                padding-bottom: 40px;
            }

            .my-title {
                font-size: 32px;
            }

            .shortcuts {
                gap: 18px;
                margin-bottom: 28px;
            }

            .shortcut-icon {
                width: 50px;
                height: 50px;
            }

            .search-container {
                width: 100%;
            }

            .search-box {
                padding-left: 16px;
            }

            .search-box input[type="submit"] {
                padding-right: 20px;
                padding-left: 20px;
            }
        }

        /* ===== 螢幕高度較小時，避免內容被擠出 ===== */
        @media (max-height: 500px) {
            body {
                padding-top: 12px;
                padding-bottom: 20px;
            }

            .my-title {
                font-size: 28px;
                margin-bottom: 12px;
            }

            .shortcuts {
                gap: 16px;
                margin-bottom: 18px;
            }

            .shortcut-icon {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }
        }
